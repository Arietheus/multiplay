<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Arena</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b0f17; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    display: flex; gap: 10px; align-items: center;
    color: #cdd6e4; font-size: 13px; user-select: none;
  }
  #dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #f59e0b; box-shadow: 0 0 8px #f59e0b;
    transition: background .2s, box-shadow .2s;
  }
  #dot.on  { background: #10b981; box-shadow: 0 0 8px #10b981; }
  #dot.off { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

  #namebar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 8px;
    background: rgba(17,24,39,.85); padding: 8px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(6px);
  }
  #namebar input {
    background: #0b0f17; border: 1px solid rgba(255,255,255,.12);
    color: #e5e7eb; padding: 7px 10px; border-radius: 7px; font: inherit; width: 150px;
  }
  #namebar button {
    background: #3b82f6; color: white; border: none;
    padding: 7px 14px; border-radius: 7px; font: inherit; cursor: pointer;
  }
  #namebar button:hover { background: #2563eb; }

  #hint {
    position: fixed; top: 14px; right: 14px; z-index: 10;
    color: #6b7280; font-size: 12px; text-align: right; line-height: 1.6; user-select: none;
  }
  kbd {
    background: #1f2937; border: 1px solid rgba(255,255,255,.1);
    border-radius: 4px; padding: 1px 6px; color: #cdd6e4;
  }
</style>
</head>
<body>
  <div id="hud"><span id="dot" class="off"></span><span id="status">connecting…</span></div>
  <div id="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrow keys to move</div>
  <div id="namebar">
    <input id="name" placeholder="your name" maxlength="16" />
    <button id="setname">set</button>
  </div>
  <canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const dotEl = document.getElementById('dot');

let W = 0, H = 0;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

let myId = null;
let world = { width: 1600, height: 1600 };
let state = { players: [] };
const input = { up: false, down: false, left: false, right: false };

// --- Networking ---
// Derive ws:// vs wss:// from the page protocol so the SAME file works
// locally (http -> ws) and on Render (https -> wss). This is the #1 thing
// people get wrong when deploying.
let ws;
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => { setStatus('connected', 'on'); };
  ws.onclose = () => { setStatus('reconnecting…', 'off'); setTimeout(connect, 1000); };
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'welcome') { myId = msg.id; world = msg.world; }
    else if (msg.type === 'state') { state = msg; }
  };
}
function setStatus(text, cls) { statusEl.textContent = text; dotEl.className = cls; }
connect();

// --- Input ---
const KEYS = {
  KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down',
  KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right',
};
function sendInput() {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'input', input }));
}
addEventListener('keydown', (e) => {
  if (document.activeElement.tagName === 'INPUT') return;
  const dir = KEYS[e.code]; if (!dir) return;
  e.preventDefault();
  if (!input[dir]) { input[dir] = true; sendInput(); }
});
addEventListener('keyup', (e) => {
  const dir = KEYS[e.code]; if (!dir) return;
  if (input[dir]) { input[dir] = false; sendInput(); }
});

document.getElementById('setname').onclick = () => {
  const name = document.getElementById('name').value.trim();
  if (name && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'name', name }));
  document.getElementById('name').blur();
};

// --- Render loop ---
// The client never simulates movement; it just draws whatever the server's
// last snapshot said. Simple and cheat-resistant. (You'd add interpolation
// here later for extra smoothness.)
function draw() {
  ctx.fillStyle = '#0b0f17';
  ctx.fillRect(0, 0, W, H);

  const me = state.players.find((p) => p.id === myId);
  const camX = me ? me.x - W / 2 : world.width / 2 - W / 2;
  const camY = me ? me.y - H / 2 : world.height / 2 - H / 2;

  // grid
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  const grid = 80;
  for (let x = -camX % grid; x < W; x += grid) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = -camY % grid; y < H; y += grid) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // world border
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 3;
  ctx.strokeRect(-camX, -camY, world.width, world.height);

  // players
  for (const p of state.players) {
    const x = p.x - camX, y = p.y - camY;
    ctx.beginPath();
    ctx.arc(x, y, 22, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    if (p.id === myId) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); }
    ctx.fillStyle = '#e5e7eb';
    ctx.font = '13px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, x, y - 30);
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
