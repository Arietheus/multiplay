<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Run Lobby</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f17; --panel: #111827; --panel2: #0f1522;
    --line: rgba(255,255,255,.10); --text: #e5e7eb; --muted: #9ca3af;
    --accent: #3b82f6; --accent2: #2563eb; --danger: #ef4444; --ok: #10b981;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg);
    color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  canvas { display: block; cursor: none; }
  button { font: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  /* ---- Auth ---- */
  #auth {
    position: fixed; inset: 0; z-index: 50; display: flex;
    align-items: center; justify-content: center;
    background: radial-gradient(1200px 600px at 50% -10%, #16213a 0%, var(--bg) 60%);
  }
  .card {
    width: 360px; max-width: calc(100vw - 32px);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .card h1 { font-size: 20px; margin-bottom: 4px; letter-spacing: .5px; }
  .card p.sub { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tabs button {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--muted);
  }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    background: var(--panel2); border: 1px solid var(--line);
    color: var(--text); font: inherit;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .primary {
    width: 100%; padding: 11px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; margin-top: 4px;
  }
  .primary:hover { background: var(--accent2); }
  .msg { min-height: 16px; font-size: 12px; color: var(--danger); margin-top: 10px; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 12px; line-height: 1.5; }

  /* ---- HUD ---- */
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 20; display: flex;
    gap: 10px; align-items: center; font-size: 13px; user-select: none;
  }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger);
    box-shadow: 0 0 8px currentColor; color: var(--danger); }
  #dot.on { background: var(--ok); color: var(--ok); }
  #room { color: var(--muted); }
  #topright { position: fixed; top: 12px; right: 12px; z-index: 20; display: flex; gap: 8px; }
  #topright button {
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: rgba(17,24,39,.85); color: var(--text); backdrop-filter: blur(6px);
  }
  #topright button:hover { border-color: var(--accent); }

  /* ---- Door prompt ---- */
  #prompt {
    position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); z-index: 20;
    background: rgba(17,24,39,.9); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px; font-size: 13px; user-select: none;
  }
  #prompt kbd { background: #1f2937; border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 7px; margin: 0 2px; }

  /* ---- Chat ---- */
  #chat { position: fixed; bottom: 12px; left: 12px; z-index: 20; width: 360px; max-width: 60vw; }
  #chatlog {
    display: flex; flex-direction: column; gap: 3px; max-height: 190px; overflow-y: auto;
    padding: 8px; margin-bottom: 6px; font-size: 12.5px; line-height: 1.4;
    background: rgba(11,15,23,.55); border: 1px solid var(--line); border-radius: 10px;
  }
  #chatlog:empty { display: none; }
  #chatlog .name { font-weight: 700; }
  #chatlog .sys { color: var(--muted); font-style: italic; }
  #chatform { display: flex; gap: 6px; }
  #chatform.hidden { display: none; }
  #chatinput {
    flex: 1; padding: 8px 10px; border-radius: 8px; background: var(--panel2);
    border: 1px solid var(--line); color: var(--text); font: inherit;
  }
  #chatinput:focus { outline: none; border-color: var(--accent); }

  /* ---- Overlays (controls + runs) ---- */
  .overlay {
    position: fixed; inset: 0; z-index: 40; display: flex; align-items: center;
    justify-content: center; background: rgba(3,6,12,.7); backdrop-filter: blur(3px);
  }
  .modal {
    width: 440px; max-width: calc(100vw - 32px); max-height: 80vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 22px;
  }
  .modal h2 { font-size: 17px; margin-bottom: 14px; display: flex; justify-content: space-between; }
  .modal h2 button { background: none; border: none; color: var(--muted); font-size: 18px; }
  .bindrow, .runrow {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px;
    background: var(--panel2);
  }
  .bindrow .act { color: var(--text); }
  .bindrow .soon { color: var(--muted); font-size: 11px; }
  .keybtn {
    min-width: 96px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line);
    background: #0b0f17; color: var(--text); text-align: center;
  }
  .keybtn.listening { border-color: var(--accent); color: var(--accent); }
  .runrow .meta { color: var(--muted); font-size: 12px; }
  .runrow button, .modal .primary.small { width: auto; padding: 6px 14px; margin: 0; }
  .modal .createbar { display: flex; gap: 8px; margin-top: 6px; }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 2px; }
</style>
</head>
<body>
  <!-- Auth -->
  <div id="auth">
    <div class="card">
      <h1>RUN LOBBY</h1>
      <p class="sub">Sign in to enter the lobby.</p>
      <div class="tabs">
        <button id="tabLogin" class="active">Log in</button>
        <button id="tabRegister">Create account</button>
      </div>
      <div class="field">
        <label for="u">Username</label>
        <input id="u" autocomplete="username" maxlength="20" />
      </div>
      <div class="field">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" maxlength="200" />
      </div>
      <button id="submit" class="primary">Log in</button>
      <div id="authmsg" class="msg"></div>
      <div class="hint" id="authhint"></div>
    </div>
  </div>

  <!-- Game -->
  <div id="game" class="hidden">
    <canvas id="c"></canvas>
    <div id="hud"><span id="dot"></span><span id="who"></span><span id="room"></span></div>
    <div id="topright">
      <button id="btnControls">Controls</button>
      <button id="btnLogout">Log out</button>
    </div>
    <div id="prompt" class="hidden"></div>
    <div id="chat">
      <div id="chatlog"></div>
      <form id="chatform" class="hidden" autocomplete="off">
        <input id="chatinput" maxlength="200" placeholder="say something…" />
      </form>
    </div>
  </div>

  <!-- Controls overlay -->
  <div id="controls" class="overlay hidden">
    <div class="modal">
      <h2>Controls <button id="closeControls">×</button></h2>
      <div id="bindlist"></div>
      <button id="resetBinds" class="primary small" style="margin-top:8px;">Reset to defaults</button>
    </div>
  </div>

  <!-- Run browser overlay -->
  <div id="runs" class="overlay hidden">
    <div class="modal">
      <h2>Runs <button id="closeRuns">×</button></h2>
      <div id="runlist"></div>
      <div class="createbar">
        <button id="createRun" class="primary small">Create a run</button>
        <button id="refreshRuns" class="keybtn">Refresh</button>
      </div>
    </div>
  </div>

  <script src="physics.js"></script>
  <script src="game.js"></script>
</body>
</html>
